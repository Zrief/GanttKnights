name: astrbot_plugin_ganttknights
display_name: 明日方舟甘特图
short_desc: 明日方舟近期活动甘特图，一键出图，可每日定时推送。
desc: |
  用一张长图看清《明日方舟》近期的活动排期：活动与卡池时间轴、凭证兑换、新增时装、新增模组。
  数据来自 [PRTS Wiki](https://prts.wiki)。

  - `/方舟日程` 出图（首次自动抓取数据）；其余指令见 `/甘特图帮助`
  - 可开每日定时推送：只在「即将结束 / 今天开启」这类节点附一句文字，平时只发图；也能设成没有提醒就整次静默
  - 时间窗、底栏面板、背景图、提醒节点、推送时刻都能在插件配置里改
version: 0.1.5
author: Zrief
repo: https://github.com/Zrief/GanttKnights
astrbot_version: ">=4.17.0"
support_platforms:
  - qq_official
  - aiocqhttp
tags:
  - 明日方舟
  - arknights
  - PRTS
  - 游戏
