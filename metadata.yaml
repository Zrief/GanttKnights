name: astrbot_plugin_ganttknights
display_name: 罗德岛甘特图
short_desc: 明日方舟近期活动甘特图，一键出图，可每日定时推送。
desc: |
  基于 PRTS Wiki 生成明日方舟近期活动甘特图长图：
  活动/卡池时间轴、凭证兑换、新增时装、新增模组一图看完。
  指令随时出图；可开启每日定时推送到用过的会话，并给出「今天和上次比变了什么」。
  时间窗、底栏面板、背景图、推送时刻等可在插件配置里调整。
version: 0.1.0
author: Zrief
repo: https://github.com/Zrief/GanttKnights
astrbot_version: ">=4.17.0"
