name: astrbot_plugin_ganttknights
display_name: 罗德岛甘特图
short_desc: 明日方舟近期活动甘特图，一键出图，可每日定时推送。
desc: |
  用一张长图看清《明日方舟》近期的活动排期：活动与卡池时间轴、凭证兑换、新增时装、
  新增模组，一图看完。数据来自 [PRTS Wiki](https://prts.wiki)。

  **指令**（发在群里即可，出图约几秒）

  - `/甘特图` 立即出图（首次会自动抓取数据）
  - `/甘特图状态` 数据更新时间、最近一次数据变化、每日推送情况
  - `/甘特图刷新` 强制重新抓取并重画（管理员）
  - `/甘特图初始化` 全量重建活动数据（管理员）
  - `/甘特图帮助` 指令一览

  **每日推送**：在插件设置里打开每日推送并填好目标会话（默认 08:00），
  插件会定时把当天的长图推到那些会话，并附一句「和上次比新增了什么、结束了什么」。
  想停掉某个群的推送，把那个会话从推送目标列表里删掉即可。

  **可调**：时间窗左右范围、底栏三个面板的画/不画、背景图、推送时刻，都在插件配置里。
