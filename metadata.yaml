name: astrbot_plugin_ganttknights
display_name: 明日方舟甘特图
short_desc: 明日方舟活动排期长图，支持每日定时推送。
desc: |
  用一张长图查看《明日方舟》的活动、卡池、凭证兑换、时装和模组排期。
  数据来自 [PRTS Wiki](https://prts.wiki)。

  - `/方舟日程` 出图；完整指令见 `/方舟日程 帮助`
  - 可订阅每日推送：有节点时附提醒，也可设置为无提醒不推送
  - 时间范围、底栏面板、背景图、提醒规则和推送时间均可配置
version: 0.3.0
author: Zrief
repo: https://github.com/Zrief/GanttKnights
astrbot_version: ">=4.17.0"
support_platforms:
  - qq_official
  - aiocqhttp
tags:
  - 明日方舟
  - arknights
  - PRTS
  - 游戏
  - 图片
  - 推送
  - 甘特图
  - gantt
